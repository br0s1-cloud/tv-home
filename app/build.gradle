plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def uiUrl = (project.findProperty("uiUrl") ?: "").toString()

android {
    namespace 'com.brosi.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId "com.brosi.tvhome"
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
        buildConfigField "String", "UI_URL", "\"${uiUrl}\""
    }

    signingConfigs {
        shared {
            storeFile file("tvhome.keystore")
            storePassword "tvhome123"
            keyAlias "tvhome"
            keyPassword "tvhome123"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
