plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def uiUrl = (project.findProperty("uiUrl") ?: "").toString()

android {
    namespace 'com.brosi.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId "com.brosi.tvhome"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
        buildConfigField "String", "UI_URL", "\"${uiUrl}\""
    }

    // Release signing key lives in the SIGNING_KEY GitHub secret, never in the repo.
    def ksFile = System.getenv("KEYSTORE_FILE")
    def ksPass = System.getenv("KEYSTORE_PASS")
    signingConfigs {
        release {
            if (ksFile && ksPass) {
                storeFile file(ksFile)
                storeType "pkcs12"
                storePassword ksPass
                keyAlias "tvhome"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile && ksPass) signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
