<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brosi Home</title>
  <link rel="stylesheet" href="style.css?v=__V__">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="top">
    <div class="clock">
      <div id="time" class="time">--:--</div>
      <div id="date" class="date"></div>
      <div class="weather" id="weather">
        <span class="temp" id="w-temp">--°</span>
        <span class="wsep"></span>
        <span id="w-cond" class="cond"></span>
        <span id="w-range" class="range"></span>
      </div>
    </div>

    <section class="panel yt" id="yt" aria-label="YouTube">
      <div class="panel-head"><span class="panel-title">YouTube</span><span class="panel-sub" id="yt-sub"></span><span class="yt-refresh" id="yt-refresh" tabindex="0" data-nav="1" data-action="ytrefresh"><i>↻</i> Refresh</span></div>
      <div class="yt-row" id="yt-row"></div>
    </section>

    <section class="panel gamebox" id="gamebox" aria-label="Live game"></section>
  </header>

  <main>
    <section class="home" id="home" aria-label="Home">
      <div id="matrix" class="matrix"></div>

      <section class="panel news" id="news" aria-label="Live news">
        <div class="panel-head"><span class="live-dot"></span><span class="panel-title">Live news</span><span class="panel-sub">Reuters · AP · BBC · FT · WSJ</span></div>
        <div class="news-view"><div class="news-track" id="news-track"></div></div>
      </section>

      <section class="panel stocks" id="stocks" aria-label="Markets">
        <div class="panel-head"><span class="panel-title">Markets</span><span class="stk-cat" id="stk-cat"></span><span class="stk-dots" id="stk-dots"></span><span class="stk-note" id="stk-note">15-min delayed</span></div>
        <div class="stk-grid" id="stk-grid"></div>
      </section>
    </section>
  </main>

  <!-- Every installed app (opened from the "All apps" chip) -->
  <div class="allapps" id="allapps" aria-hidden="true">
    <div class="aa-inner scroller">
      <div class="aa-title">All apps <span>Back to close</span></div>
      <section class="apps" id="apps" aria-label="All apps"></section>
    </div>
  </div>

  <nav class="dock" id="dock" aria-label="Controls"></nav>

  <div class="hint" id="hint"></div>

  <!-- Shown when the TV turns on -->
  <div class="picker" id="picker" aria-hidden="true">
    <div class="pk-inner">
      <div class="pk-greet" id="pk-greet">Good evening</div>
      <div class="pk-title">Choose your experience</div>
      <div class="pk-cards">
        <div class="pk-card" data-choice="brosi" tabindex="0">
          <div class="pk-face pk-brosi">
            <div class="pk-mini-time" id="pk-time">10:00</div>
            <div class="pk-mini-row"><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="pk-name">Brosi Home</div>
          <div class="pk-sub">Your apps, scores &amp; weather</div>
        </div>
        <div class="pk-card" data-choice="google" tabindex="0">
          <div class="pk-face pk-google">
            <div class="pk-g-row"></div><div class="pk-g-row short"></div><div class="pk-g-row"></div>
          </div>
          <div class="pk-name">Google TV</div>
          <div class="pk-sub">Recommendations &amp; Assistant</div>
        </div>
      </div>
      <div class="pk-count" id="pk-count"></div>
    </div>
  </div>

  <script src="config.js?v=__V__"></script>
  <script src="app.js?v=__V__"></script>
</body>
</html>
